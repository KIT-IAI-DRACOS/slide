[project]
name = "slide"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.3.3",
  "omegaconf>=2.3.0",
  "torch>=2.6.0",
  "hydra-core>=1.3.2",
  "lightning>=2.5.5",
  "pandas>=2.3.2",
  "plotly>=6.3.0",
  "wandb>=0.30.0",
  "einops>=0.8.1",
  "datasets>=4.0.0",
  "scipy>=1.16.3",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "S",
    "B",
    "ANN",
    "RUF",
]

ignore = [
    "S311", 
    "ANN401", 
]
