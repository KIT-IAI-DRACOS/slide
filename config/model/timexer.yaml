model_name: "timexer"
wandb_project: "skolr"

batch_size: 32

patch_len: 24
d_model: 256
d_ff_factor: 2
e_layers: 1
n_heads: 4
factor: 3
dropout: 0.1
use_norm: ${normalization.target}
use_exog_norm: ${normalization.exogenous}
activation: "gelu"
use_future_exog: True
use_static_exog: True

lr: 0.001
lr_monitor: True

loss_function: 'mae'

module:
  _target_: models.timexer.timexer_adapter.TimexerAdapter
  endo_num: ${dataset.num_time_series}
  future_num: ${dataset.num_future_features}
  stat_num: ${dataset.num_static_features}
  seq_len: ${sample.input_length}
  pred_len: ${sample.target_length}
  patch_len: ${model.patch_len}
  d_model: ${model.d_model}
  d_ff_factor: ${model.d_ff_factor}
  factor: ${model.factor}
  activation: ${model.activation}
  e_layers: ${model.e_layers}
  n_heads: ${model.n_heads}
  dropout: ${model.dropout}
  use_norm: ${model.use_norm}
  use_exog_norm: ${model.use_exog_norm}
  use_future: ${model.use_future_exog}
  use_static_exog: ${model.use_static_exog}
  static_cardinalities: ${dataset.static_cardinalities}
  static_embedding_dims: ${dataset.embedding_dims}
  lr: ${model.lr}
  loss_function: ${model.loss_function}
  inverse_transform: ${scalers.inverse_transform}
