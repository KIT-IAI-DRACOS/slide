model_name: "mamko"
wandb_project: "mamko"

batch_size: 256

latent_dim: 64
d_conv: 32
delta: 1
hidden_dim: 256

use_norm: ${normalization.target}
use_exog_norm: ${normalization.exogenous}

use_static: True
shifted_u: false

lr: 1e-3
weight_decay: 0.001
lr_scheduler: True
optimizer_step: 50
optimizer_gamma: 0.9


lr_monitor: True

loss_function: 'mae'

module:
  _target_: models.mamko.mamko_adapter.MamkoAdapter
  pred_horizon: ${sample.target_length}
  old_horizon: ${sample.input_length}
  latent_dim: ${model.latent_dim}
  state_dim: ${dataset.num_time_series}
  d_conv: ${model.d_conv}
  future_num: ${dataset.num_future_features}
  stat_num: ${dataset.num_static_features}
  past_num: ${dataset.num_past_features}
  delta: ${model.delta}
  hidden_dim: ${model.hidden_dim}
  use_norm: ${model.use_norm}
  use_exog_norm: ${model.use_exog_norm}
  use_static_exog: ${model.use_static}
  shifted_u: ${model.shifted_u}
  static_cardinalities: ${dataset.static_cardinalities}
  static_embedding_dims: ${dataset.embedding_dims}
  lr: ${model.lr}
  weight_decay: ${model.weight_decay}
  lr_scheduler: ${model.lr_scheduler}
  optimizer_step: ${model.optimizer_step}
  optimizer_gamma: ${model.optimizer_gamma}
  loss_function: ${model.loss_function}
  inverse_transform: ${scalers.inverse_transform}
